<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한글 시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", "AppleMyungjo", serif;
  }
  body { box-sizing: border-box; padding: 2.5vmin; }

  #clock {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    border-top: 1px solid #fff;
    border-left: 1px solid #fff;
  }
  .cell {
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    min-width: 0;
    min-height: 0;
    padding: 1.2% 2%;
    box-sizing: border-box;
  }
  .line {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }
  .t {
    display: inline-block;
    white-space: nowrap;
    line-height: 1;
    font-weight: 600;
    transform-origin: center center;
    color: #000;               /* 검정 바탕 위 검정 글씨: 평소엔 안 보임 */
  }
  .t::selection { background: #000; color: #fff; }  /* 드래그로 선택하면 흰 글씨로 드러남 */
  .t::-moz-selection { background: #000; color: #fff; }
  #probe { position: absolute; left: -9999px; top: 0; visibility: hidden; }
</style>
</head>
<body>
<main id="clock" aria-label="한글 시계"></main>
<span id="probe" class="t" aria-hidden="true"></span>

<script>
  const DIGIT = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const HOUR  = ['열두', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열', '열한'];

  function sino(n) {
    if (n === 0) return '영';
    const t = Math.floor(n / 10), o = n % 10;
    let s = '';
    if (t > 0) s += (t > 1 ? DIGIT[t] : '') + '십';
    return s + DIGIT[o];
  }

  const clock = document.getElementById('clock');
  const cells = [];   // [{el, lines:[{box, t}]}]

  for (let c = 0; c < 12; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const lines = [];
    for (let l = 0; l < 4; l++) {
      const box = document.createElement('div');
      box.className = 'line';
      const t = document.createElement('span');
      t.className = 't';
      box.appendChild(t);
      cell.appendChild(box);
      lines.push(t);
    }
    clock.appendChild(cell);
    cells.push({ el: cell, lines });
  }

  let text = '';

  // 글자가 칸 가로를 꽉 채우도록 글자 크기를 맞추고, 세로는 줄 높이만큼 늘림
  function fit() {
    const probe = document.getElementById('probe');
    const cs = getComputedStyle(cells[0].el);
    const cellW = cells[0].el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const lineH = cells[0].lines[0].parentElement.clientHeight;

    probe.style.transform = 'none';
    probe.style.fontSize = '100px';
    probe.textContent = text;
    const w0 = probe.getBoundingClientRect().width;
    if (!w0) return;

    const fs = 100 * cellW / w0;
    const sy = Math.min(Math.max(lineH / fs * 0.98, 0.3), 6);

    for (const c of cells) for (const t of c.lines) {
      t.style.fontSize = fs + 'px';
      t.style.transform = `scaleY(${sy})`;
    }
  }

  // 선택이 풀리지 않도록, 바뀐 글자만 제자리에서 교체
  function setText(span, str) {
    let node = span.firstChild;
    if (!node) node = span.appendChild(document.createTextNode(''));
    const old = node.data;
    if (old === str) return;
    let p = 0;
    const max = Math.min(old.length, str.length);
    while (p < max && old[p] === str[p]) p++;
    let s = 0;
    while (s < max - p && old[old.length - 1 - s] === str[str.length - 1 - s]) s++;
    node.replaceData(p, old.length - p - s, str.slice(p, str.length - s));
  }

  function tick() {
    const d = new Date();
    const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    const ampm = h < 12 ? '오전' : '오후';
    text = `${ampm} ${HOUR[h % 12]}시 ${sino(m)}분 ${sino(s)}초`;

    const cur = h % 12;                    // 현재 시간 칸
    const nLines = Math.floor(m / 15) + 1; // 15분마다 한 줄

    for (let c = 0; c < 12; c++) {
      const count = c < cur ? 4 : c === cur ? nLines : 0;
      for (let l = 0; l < 4; l++) {
        setText(cells[c].lines[l], l < count ? text : '');
      }
    }
    document.title = text;
    fit();
  }

  tick();
  setInterval(tick, 250);
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
